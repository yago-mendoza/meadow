<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post-its · prueba</title>
<link rel="stylesheet" href="postits.css">
<style>
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", sans-serif; background: #f7f5f8; color: #3b3341; }
  #top { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #fff; border-bottom: 1px solid #e6e2ea;
    display: flex; align-items: center; gap: 12px; padding: 0 18px; box-sizing: border-box; z-index: 100; }
  #top button { border: 0; background: #f1e9ef; color: #714b67; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: 600 13px "Segoe UI"; }
  #board { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; overflow: auto; }
  #inner { position: relative; width: 2200px; height: 1600px; }
  .box { position: absolute; background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(60,40,70,.06), 0 6px 18px rgba(60,40,70,.08);
    padding: 12px 14px; font-size: 13px; border-top: 5px solid var(--c); }
  .box h4 { margin: 0 0 6px; font-size: 14px; }
  #log { position: fixed; right: 10px; bottom: 10px; width: 360px; max-height: 160px; overflow: auto; background: rgba(255,255,255,.9);
    font: 11px Consolas, monospace; padding: 6px 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); z-index: 1; }
</style>
</head>
<body>
<header id="top"><b>Meadow</b><button id="add">+ post-it</button><button id="vis">ocultar</button></header>
<div id="board"><div id="inner"></div></div>
<div id="layer"></div>
<pre id="log"></pre>
<script type="module">
  import { createPostits } from './postits.js';
  const inner = document.getElementById('inner');
  const cols = ['#c9b6e4', '#a8d5ba', '#f6c6a8', '#a9c8ee', '#f2d98b'];
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'box'; b.style.setProperty('--c', cols[i % 5]);
    b.style.left = (30 + (i % 6) * 250) + 'px'; b.style.top = (24 + Math.floor(i / 6) * 230) + 'px';
    b.style.width = '210px'; b.style.height = '170px';
    b.innerHTML = `<h4>Documento ${i + 1}</h4>Texto de relleno para ver qué queda debajo de las notas. Una columna, un marco, una tarea.`;
    inner.append(b);
  }
  const log = document.getElementById('log');
  window.changes = [];
  const p = createPostits(document.getElementById('layer'), {
    notes: [{ id: 'p1', x: 0.42, y: 0.30, w: 190, h: 150, text: 'Llamar a Marta antes del viernes', color: '#fff3b0', rot: -1.5, z: 3 }],
    onChange: (arr) => { window.changes.push(arr); log.textContent = JSON.stringify(arr) + '\n' + log.textContent; },
  });
  window.P = p;
  document.getElementById('add').onclick = () => p.add(innerWidth / 2, innerHeight / 2);
  let shown = true;
  document.getElementById('vis').onclick = () => { shown = !shown; p.setVisible(shown); };
  document.getElementById('board').addEventListener('dblclick', (e) => p.add(e.clientX, e.clientY));
</script>
</body>
</html>
