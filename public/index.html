<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meadow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tree.css">
</head>
<body>
<section id="home" hidden>
  <div class="hm-in">
    <h1>🌿 Meadow</h1>
    <div class="hm-actions"><button id="hm-new" class="hm-btn main">＋ Nuevo proyecto</button><button id="hm-add" class="hm-btn">📂 Abrir carpeta…</button></div>
    <h2>Proyectos</h2>
    <div id="hm-list"></div>
    <p class="hm-root">Los proyectos nuevos se guardan en <b id="hm-root"></b> · <button id="hm-root-ch">Cambiar…</button></p>
  </div>
</section>
<header id="top">
  <button class="brand" id="to-home" title="Inicio: todos los proyectos">🌿</button>
  <nav id="crumbs"></nav>
  <div class="grow"></div>
  <div id="tools"></div>
  <button id="sel-btn" class="ib" title="Contexto: Ctrl+clic en lo que quieras para elegirlo; aquí sacas o guardas la barra">◳</button>
  <button id="list-btn" class="ib" title="Tareas e ideas">☰</button>
</header>

<nav id="areas"></nav>
<main id="stage"></main>

<div id="map" class="mini"><button id="map-pill" title="Ver todo el árbol">▦ <span>Mapa</span></button><div id="map-in"></div><button id="map-size" class="ib" title="Cerrar (Esc)">×</button></div>
<div id="drawer" data-drop="drawer"><div class="dr-pull" title="El cajón: lo que sacas del árbol">🗄 <span>Cajón</span> <i id="dr-n"></i></div><div id="dr-list"></div></div>
<div id="dock"></div>
<aside id="list" class="closed"><nav><button data-l="tareas" class="on" title="Tarea: algo que hay que hacer fuera de Meadow">Tareas</button><button data-l="ideas" title="Idea: algo que se podría hacer más adelante en el propio Meadow">Ideas</button></nav><div id="list-body"></div></aside>

<div id="ed">
  <div class="ed-back"></div>
  <div class="ed-panel">
    <header>
      <button id="ed-back" class="ib" title="Volver al anterior" hidden>←</button>
      <span id="ed-ico">📄</span>
      <input id="ed-name" spellcheck="false">
      <div class="grow"></div>
      <div id="ed-lv">
        <button class="ib h" data-l="1" title="Dividir por títulos #">#</button>
        <button class="ib h" data-l="2" title="Dividir por títulos ##">##</button>
        <button class="ib h" data-l="3" title="Dividir por títulos ###">###</button>
      </div>
      <button id="ed-task" class="ib" title="Tareas: insertar una aquí (o escribe []) o ver las de este documento"><span class="ed-task-ico"></span></button>
      <button id="ed-idea" class="ib" title="Ideas: insertar una aquí o ver las de este documento">💡</button>
      <button id="ed-foldall" class="ib" title="Plegar o desplegar todos los títulos">⇕</button>
      <button id="ed-plain" class="ib fmt on" title="Formato a la vista · clic: texto en crudo">¶</button>
      <button id="ed-min" class="ib" title="Minimizar: queda abajo, a mano">–</button>
      <button id="ed-close" class="ib" title="Cerrar (Esc)">×</button>
    </header>
    <div class="ed-main">
      <nav id="ed-toc"><div class="toc-h">Índice</div><div id="toc-list"></div></nav>
      <div class="ed-col"><div id="ed-crumbs"></div><div id="ed-tabs"></div><div id="ed-body"></div></div>
    </div>
    <footer id="ed-foot"></footer>
  </div>
</div>

<button id="linkpill" title="Convertir en enlace (Ctrl+K)">🔗 Enlazar</button>
<div id="linker"><div class="lk-head"><input id="lk-q" placeholder="Busca por nombre, o baja por el árbol…" autocomplete="off"><span class="lk-sel"></span></div><div id="lk-crumbs"></div><div id="lk-list"></div><div class="lk-foot">↑↓ elegir · Enter enlazar · → entrar · ← subir · Esc cerrar</div></div>
<div id="drop-bar"></div>
<div id="ghost"></div>
<div id="ipeek"></div>
<div id="selpill"></div>
<div id="draw" hidden><div class="dw-in">
  <div class="dw-head"><span class="dw-k">🖍 Dibujo</span><span class="dw-where"></span><span class="dw-cur" title="Con lo que dibujas ahora"></span></div>
  <div class="dw-top"></div>
  <div class="dw-mid"><div class="dw-left"></div><div class="dw-sheet"><canvas id="dw-c" width="144" height="96"></canvas><i class="dw-px" hidden></i></div><div class="dw-right"></div></div>
  <div class="dw-shapes"></div>
  <div class="dw-bar"><span class="dw-tip">Pasa por un color o una figura para cogerlos; arrastra sobre la lámina para ponerla.</span><button class="dw-undo" title="Ctrl+Z">↶ Deshacer</button><button class="dw-clear">Vaciar</button><button class="dw-rm">Quitar el dibujo</button><button class="dw-close">Listo</button></div>
</div></div>
<div id="task" hidden><div class="tk-in"></div></div>
<div id="pick"></div>
<div id="toasts"></div>
<script type="module" src="app.js"></script>
</body>
</html>
